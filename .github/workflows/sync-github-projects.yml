name: Sync GitHub Projects

on:
  schedule:
    - cron: "0 2 * * *" # Every day at 2:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run GitHub project sync
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PROJECT_SYNC_TOKEN }}
        run: pnpm exec node src/utils/sync-github-projects.mjs
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync GitHub projects [auto]"
          branch: ${{ github.event.repository.default_branch }}
